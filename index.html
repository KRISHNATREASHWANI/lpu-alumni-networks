<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluminite — Alumni Mentor Network</title>
<!-- Using system fonts — no external font import needed -->
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<!-- Animated background canvas -->
<canvas id="bgCanvas"></canvas>

<!-- Cursor glow -->
<div class="cursor-glow" id="cursorGlow"></div>

<div id="app">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="wordmark">
        <h1><button type="button" class="home-link" id="homeLink">Alumin<em>ite</em></button></h1>
        <span class="tag mono">LPU · ALUMNI NETWORK</span>
      </div>
      <nav class="tabs" id="topNav"></nav>
      <div class="auth-actions" id="authActions"></div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="mainContent"></main>
  <nav class="bottom-tabs" id="bottomNav"></nav>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>
</div>

</body>
</html>
